
name: Student Management CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  ACR_NAME: studentmanagementacr
  ACR_LOGIN_SERVER: studentmanagementacr.azurecr.io
  IMAGE_NAME: student-management
  RESOURCE_GROUP: rg-student-cicd
  AKS_CLUSTER: student-management-aks
  DEPLOYMENT_NAME: student-management
  CONTAINER_NAME: student-management

jobs:
  build-and-deploy:
    name: Build, Test and Deploy
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Configure Java
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Step 3: Configure Maven Wrapper
      - name: Configure Maven Wrapper
        run: chmod +x ./mvnw

      # Step 4: Build and test application
      - name: Maven Build and Test
        run: ./mvnw -B clean verify

      # Step 5: Build Docker image
      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }} .

      # Step 6: Verify Docker image
      - name: Verify Docker Image
        run: docker images ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}

      # Step 7: Authenticate with Azure
      - name: Azure Login
        if: github.event_name == 'push'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Step 8: Login to Azure Container Registry
      - name: Login to ACR
        if: github.event_name == 'push'
        run: az acr login --name ${{ env.ACR_NAME }}

      # Step 9: Push Docker image to ACR
      - name: Push Docker Image
        if: github.event_name == 'push'
        run: |
          docker push \
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      # Step 10: Connect to AKS
      - name: Connect to AKS
        if: github.event_name == 'push'
        run: |
          az aks get-credentials \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.AKS_CLUSTER }} \
            --admin \
            --overwrite-existing

      # Step 11: Deploy updated image to Kubernetes
      - name: Deploy to AKS
        if: github.event_name == 'push'
        run: |
          kubectl set image deployment/${{ env.DEPLOYMENT_NAME }} \
            ${{ env.CONTAINER_NAME }}=${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      # Step 12: Verify deployment rollout
      - name: Verify AKS Deployment
        if: github.event_name == 'push'
        run: |
          kubectl rollout status deployment/${{ env.DEPLOYMENT_NAME }} --timeout=180s
          kubectl get deployments
          kubectl get pods
