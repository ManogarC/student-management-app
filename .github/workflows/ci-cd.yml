
name: Student Management CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Test and Docker Build
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Configure Java
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Step 3: Make Maven wrapper executable
      - name: Configure Maven Wrapper
        run: chmod +x ./mvnw

      # Step 4: Build and execute unit tests
      - name: Maven Build and Test
        run: ./mvnw -B clean verify

      # Step 5: Build Docker image
      - name: Build Docker Image
        run: |
          docker build \
            -t student-management:${{ github.sha }} .

      # Step 6: Display Docker image
      - name: Verify Docker Image
        run: docker images student-management
